<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#090d16"/>
  <circle cx="1050" cy="150" r="300" fill="#6366f1" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="150" cy="500" r="250" fill="#8b5cf6" fill-opacity="0.1" filter="blur(80px)"/>
  <g transform="translate(100, 100)">
    <rect width="64" height="64" rx="16" fill="url(#brand-grad)"/>
    <text x="32" y="42" font-size="28" text-anchor="middle" fill="#ffffff">💼</text>
